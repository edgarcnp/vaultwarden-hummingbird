# The real container image: build it (single arch is enough for routine
# PRs; the full multi-arch build stays in publish) and smoke the
# entrypoint. The supervisor suite cannot see production-specific code
# paths: vaultwarden's source build, the binary downloads, and the runtime
# image assembly — so this builds the actual image rather than unit-testing
# the recipe.
name: image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container image
        run: |
          podman build \
            --format docker \
            --platform linux/amd64 \
            --tag pr-check:ci \
            .

      - name: Verify the healthcheck survived the build
        run: |
          test "$(podman inspect pr-check:ci \
            --format '{{json .HealthCheck.Test}}')" != "null"

      # Smoke: the supervisor must run inside the runtime image (dynamic
      # linking and baked paths intact) and fail fast with no gate to
      # probe — exit 1, not a crash.
      - name: Smoke test the entrypoint
        run: |
          podman run --rm --network none --entrypoint /entrypoint pr-check:ci --healthcheck \
            && exit 1 || test $? -eq 1
