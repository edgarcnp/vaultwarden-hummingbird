# Upstream checksum pins: the Containerfile's digests must always match
# its version ARGs. Renovate runs scripts/update-pins.sh after every
# version bump; this workflow recomputes the pins and fails on drift -
# so a version bumped without its digest, or an upstream artifact
# replaced at the same tag (the weekly run catches that), is red here.
name: Pins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Containerfile
      - scripts/update-pins.sh
      - .github/workflows/publish.yml
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC

# Superseded runs on the same branch don't need to finish.
concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recompute the pins
        run: scripts/update-pins.sh

      - name: Fail on drift
        run: git diff --exit-code Containerfile

      # The syft pin in publish.yml is manual (no Renovate datasource
      # carries its digest), so re-download the artifact here: a stale or
      # replaced release is a red build, exactly like the Containerfile
      # pins.
      - name: Recheck the syft pin
        run: |
          url=$(grep -oE 'https://github\.com/anchore/syft/releases/download/v[0-9.]+/syft_[0-9.]+_linux_amd64\.tar\.gz' .github/workflows/publish.yml)
          sha=$(grep -oE '[0-9a-f]{64}  /tmp/syft\.tgz' .github/workflows/publish.yml | cut -d' ' -f1)
          test -n "$url" && test -n "$sha"
          curl -fsSL --max-time 300 --retry 3 -o /tmp/syft.tgz "$url"
          echo "$sha  /tmp/syft.tgz" | sha256sum -c -
