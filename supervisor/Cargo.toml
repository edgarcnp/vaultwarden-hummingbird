[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = { version = "0.15", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
percent-encoding = { version = "2", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
signal-hook = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
