# Build and publish the multi-arch image to ghcr.io. The workflow changes
# no versions: it builds whatever ARG pins the Containerfile holds (Renovate
# owns the bumps).
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Per-arch images from a stale run must not overwrite a good manifest list.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tag names the supervisor version it ships: a pushed
      # tag must match supervisor/Cargo.toml, never drift from it.
      - name: Verify the tag matches the supervisor version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' supervisor/Cargo.toml)
          test "$tag" = "$version" || {
            echo "tag v$tag does not match supervisor version $version" >&2
            exit 1
          }

      # ghcr.io rejects uppercase in image paths; repository names can
      # carry it.
      - name: Normalize the image reference
        run: echo "IMAGE=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Podman login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          # --format docker: HEALTHCHECK is an OCI-invalid field; podman's
          # default OCI format silently drops it (verified on podman 5.8).
          podman build \
            --format docker \
            --platform linux/${{ matrix.arch }} \
            --tag "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            .

      # The full fail-closed smoke suite runs against the real release
      # image (every release is exercised on both arches, not just built):
      # entrypoint execution, strict-dotenv refusals, exec-form healthcheck,
      # and the Tailscale fail-closed chain.
      - name: Smoke test the release image
        run: scripts/smoke-image.sh "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}"

      - name: Push per-arch tag
        run: podman push "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}"

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push-manifest.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Normalize the image reference
        id: image
        run: |
          IMAGE=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Podman login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the manifest list
        id: push-manifest
        run: |
          # Strip the ref prefix so both `v1.2.3` and `main` collapse to a
          # usable tag (`v1.2.3` on tag pushes, `main` on manual runs).
          VER="${GITHUB_REF_NAME#v}"
          podman manifest create "$IMAGE:${VER}"
          for arch in amd64 arm64; do
            podman manifest add "$IMAGE:${VER}" "docker://$IMAGE:${GITHUB_REF_NAME}-${arch}"
          done
          podman manifest push --digestfile /tmp/digest.txt "$IMAGE:${VER}" "docker://$IMAGE:${VER}"
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"
          # :latest moves only for a release tag, never a manual dispatch,
          # and never a prerelease (`v1.2.0-rc.1`).
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            podman push "$IMAGE:${VER}" "docker://$IMAGE:latest"
          fi

  provenance:
    name: provenance
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      # The attestation is minted with the workflow's OIDC token and
      # pushed to ghcr.io as a referrers manifest on the attested tag, so
      # consumers can verify the image came from this workflow via
      # `gh attestation verify oci://ghcr.io/<repo>:<tag> -R <repo>`.
      contents: read
      attestations: write
      id-token: write
      packages: write
    steps:
      # push-to-registry reads credentials from the Docker config, which
      # podman login does not populate.
      - name: Docker login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate build provenance for the released tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.manifest.outputs.image }}
          # push-to-registry requires the exact digest of the pushed
          # subject: the manifest list the manifest job published.
          subject-digest: ${{ needs.manifest.outputs.digest }}
          push-to-registry: true

  sbom:
    name: sbom
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write
    steps:
      # The SBOM describes the released amd64 image, resolved by the
      # manifest digest (multi-arch builds share the layer set covered
      # here for the platform the scan picks).
      - name: Pull the released image by digest
        run: |
          IMAGE="${{ needs.manifest.outputs.image }}"
          DIGEST="${{ needs.manifest.outputs.digest }}"
          podman pull --platform linux/amd64 "docker://${IMAGE}@${DIGEST}"
          podman tag "${IMAGE}@${DIGEST}" sbom-scan:local
          podman save --format oci-archive -o /tmp/image.tar sbom-scan:local

      # syft is fetched from its pinned release and verified against the
      # digest recorded here; never install it from a floating source.
      - name: Install syft (pinned)
        run: |
          curl -fsSL --max-time 300 --retry 3 -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz"
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft

      - name: Generate the SPDX SBOM
        run: /tmp/syft /tmp/image.tar -o spdx-json=sbom.spdx.json

      - name: Upload the SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-${{ github.ref_name }}
          path: sbom.spdx.json
          if-no-files-found: error

      # push-to-registry reads credentials from the Docker config, which
      # podman login does not populate; the attestation is bound to the
      # exact manifest digest, so the SBOM cannot be detached from it.
      - name: Docker login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Attest the SBOM for the released digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.manifest.outputs.image }}
          subject-digest: ${{ needs.manifest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
