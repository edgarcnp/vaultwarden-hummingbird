# The supervisor crate: lint and rustdoc -> test -> build, gated in that order.
name: Supervisor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# Superseded runs on the same branch don't need to finish.
concurrency:
  group: supervisor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The crate's declared MSRV (supervisor/Cargo.toml `rust-version`), verified
# by the lint job; test and build use the same compiler so a passing run
# proves the minimum, not whatever stable happened to ship on the runner.
env:
  RUST_VERSION: "1.100.0"

defaults:
  run:
    working-directory: supervisor

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships rustup; install the MSRV explicitly instead of
      # trusting the preinstalled stable to be in range.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Check the MSRV pin matches Cargo.toml
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          pinned=$(printf '%s' "$RUST_VERSION" | cut -d. -f1-2)
          test "$declared" = "$pinned" || {
            echo "Cargo.toml declares rust-version=$declared, workflow pins $RUST_VERSION"
            exit 1
          }

      - name: cargo fmt
        run: cargo +"$RUST_VERSION" fmt --check

      - name: cargo clippy
        run: cargo +"$RUST_VERSION" clippy --all-targets --locked -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +"$RUST_VERSION" doc --no-deps --document-private-items --locked

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            supervisor/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('supervisor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: cargo test
        run: cargo +"$RUST_VERSION" test --locked

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            supervisor/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('supervisor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: cargo build
        run: cargo +"$RUST_VERSION" build --locked --all-targets
