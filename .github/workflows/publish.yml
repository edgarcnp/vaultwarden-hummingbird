# Build and publish the multi-arch image to ghcr.io. The workflow changes
# no versions: it builds whatever ARG pins the Containerfile holds (Renovate
# owns the bumps).
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Per-arch images from a stale run must not overwrite a good manifest list.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io rejects uppercase in image paths; repository names can
      # carry it.
      - name: Normalize the image reference
        run: echo "IMAGE=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Podman login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          # --format docker: HEALTHCHECK is an OCI-invalid field; podman's
          # default OCI format silently drops it (verified on podman 5.8).
          podman build \
            --format docker \
            --platform linux/${{ matrix.arch }} \
            --tag "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            .

      - name: Verify the healthcheck survived the build
        run: |
          test "$(podman inspect "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --format '{{json .HealthCheck.Test}}')" != "null"

      - name: Push per-arch tag
        run: podman push "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}"

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Normalize the image reference
        run: echo "IMAGE=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Podman login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push the manifest list
        run: |
          # Strip the ref prefix so both `v1.2.3` and `main` collapse to a
          # usable tag (`v1.2.3` on tag pushes, `main` on manual runs).
          VER="${GITHUB_REF_NAME#v}"
          podman manifest create "$IMAGE:${VER}"
          for arch in amd64 arm64; do
            podman manifest add "$IMAGE:${VER}" "docker://$IMAGE:${GITHUB_REF_NAME}-${arch}"
          done
          podman manifest push "$IMAGE:${VER}" "docker://$IMAGE:${VER}"
          podman push --digestfile /tmp/digest.txt "$IMAGE:${VER}" "docker://$IMAGE:latest" >/dev/null
          echo "DIGEST=$(cat /tmp/digest.txt)" >> "$GITHUB_ENV"

  provenance:
    name: provenance
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      # The attestation is minted with the workflow's OIDC token and
      # pushed to ghcr.io as a referrers manifest on the attested tag, so
      # consumers can verify the image came from this workflow via
      # `gh attestation verify oci://ghcr.io/<repo>:<tag> -R <repo>`.
      contents: read
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Generate build provenance for the released tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          # push-to-registry requires the exact digest of the pushed
          # subject: the manifest list pushed as :latest above.
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
