# Local runner (podman compose / docker compose). One config file (.env,
# from .env.example), mounted read-only at /state/.env (supervisor-only);
# the supervisor distributes it:
# SUPERVISOR_*/TAILSCALE_* (and the VAULTWARDEN_PORT knob) stay with PID 1,
# VAULTWARDEN_* reach vaultwarden under the stripped upstream name. The
# file is strict — only the three namespaces are accepted, anything else
# refuses to boot. Precedence is env > file everywhere. Container env is
# default-deny: only VAULTWARDEN_* keys reach the vault.
# Alternative: env_file: .env (all keys in container env).

services:
  vaultwarden:
    # VAULTWARDEN_WEB_VAULT passes through from the environment/.env when
    # set; every build arg is documented in the Containerfile (BUILD KNOBS).
    build:
      context: .
      dockerfile: Containerfile
      args:
        VAULTWARDEN_WEB_VAULT: "${VAULTWARDEN_WEB_VAULT:-true}"
    image: vaultwarden-hummingbird:local
    restart: unless-stopped
    # Covers the supervisor's TERM grace period plus the budgeted final S3
    # persists (DB dump, then identity + attachments/sends).
    stop_grace_period: 180s
    # Explicit (not just inherited from the image): podman's default OCI
    # image format drops HEALTHCHECK; a compose-level definition works with
    # any backend/format. Same probe as the Containerfile directive.
    healthcheck:
      test: ["CMD", "/entrypoint", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Least privilege: all capabilities dropped, then only the four the
    # supervisor needs. SETUID/SETGID let it start the vault as 65533:65532
    # and tailscaled as 65531:65531; KILL lets it signal them;
    # DAC_READ_SEARCH lets it read tailscaled's 0600 identity/cert files for
    # state sync (the daemon writes them 0600 by design). The children get
    # none of these across the uid change (tailscaled keeps only
    # NET_ADMIN/NET_RAW in TUN mode), and no-new-privileges keeps the
    # restriction across exec. Writable paths: /data (vault volume), /state
    # (supervisor volume), /tmp (tmpfs).
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Serves /alive only (supervisor gatekeeper), loopback-only; the API is
    # tailnet-only via tailscale serve.
    ports:
      - "127.0.0.1:8080:8080"
    # .env is the supervisor-owned dotenv file. It lives under /state
    # (2710, owner 65532, group tailscale 65531): the group can traverse
    # but not list, and 0600/0644 secrets stay owner-only; the vault's uid
    # is not in the group, so it cannot reach them. vw-data persists the
    # vault's files; vw-state persists the node identity, cert cache,
    # backup staging, and sync sidecars.
    volumes:
      - ./.env:/state/.env:ro,z
      - vw-data:/data
      - vw-state:/state
    environment:
      SUPERVISOR_ENV_FILE: /state/.env

volumes:
  vw-data:
  vw-state:
