# The container image: build the real Containerfile and run the
# fail-closed smoke suite (scripts/smoke-image.sh) on changes to the build
# context. Main pushes and pull requests that touch the context both build,
# so an image regression is caught before merge; releases are built and
# smoke-tested again by publish at tag time (both arches). This workflow
# does not run on tags; a manual dispatch covers ad-hoc validation.
name: Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &image_paths
      - Containerfile
      - .containerignore
      - .github/workflows/image.yml
      - scripts/smoke-image.sh
      # supervisor/ is copied into the image; a change there can break the
      # image build even when the crate's own test suite passes.
      - supervisor/**
  pull_request:
    paths: *image_paths

# Superseded runs on the same branch don't need to finish.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The supervisor suite cannot see production-specific code paths:
      # vaultwarden's source build, the binary downloads, the runtime
      # assembly. Build the real image (single arch is enough for routine
      # checks; the full multi-arch build stays in publish).
      - name: Build the container image
        run: |
          podman build \
            --format docker \
            --platform linux/amd64 \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' supervisor/Cargo.toml)" \
            --tag pr-check:ci \
            .

      # The full fail-closed smoke suite: entrypoint execution in the
      # runtime image, strict-dotenv refusals, and the Tailscale
      # fail-closed chain. The same script contributors run locally.
      - name: Smoke test the image
        run: scripts/smoke-image.sh pr-check:ci

  # Native arm64 build/smoke: the same runner class the tag publish uses.
  # No qemu; the Containerfile compiles natively on the arm64 host.
  image-arm64:
    name: Build and smoke (arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container image
        run: |
          podman build \
            --format docker \
            --platform linux/arm64 \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' supervisor/Cargo.toml)" \
            --tag pr-check:ci \
            .

      - name: Smoke test the image
        run: scripts/smoke-image.sh pr-check:ci
