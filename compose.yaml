# Local runner (podman compose / docker compose). One config file (.env,
# from .env.example), mounted read-only; the supervisor distributes it:
# SUPERVISOR_*/TAILSCALE_* stay with PID 1, VAULTWARDEN_* reach vaultwarden
# under the stripped upstream name (the rest is forwarded verbatim).
# Alternative: env_file: .env (all keys in container env).

services:
  vaultwarden:
    # VAULTWARDEN_WEB_VAULT passes through from the environment/.env when
    # set; every build arg is documented in the Containerfile (BUILD KNOBS).
    build:
      context: .
      dockerfile: Containerfile
      args:
        VAULTWARDEN_WEB_VAULT: "${VAULTWARDEN_WEB_VAULT:-true}"
    image: vaultwarden-hummingbird:local
    restart: unless-stopped
    # Covers the supervisor's TERM grace period plus the final S3 state push.
    stop_grace_period: 90s
    # Explicit (not just inherited from the image): podman's default OCI
    # image format drops HEALTHCHECK; a compose-level definition works with
    # any backend/format. Same probe as the Containerfile directive.
    healthcheck:
      test: ["CMD", "/entrypoint", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Least privilege: no capabilities, no privilege escalation, read-only
    # rootfs. Writable paths: /data (volume) + /tmp (tmpfs).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # Serves /alive only (supervisor gatekeeper), loopback-only; the API is
    # tailnet-only via tailscale serve.
    ports:
      - "127.0.0.1:8080:8080"
    # .env is the supervisor-owned dotenv file; vw-data persists /data
    # (vault DB + tailscaled state) across redeploys.
    volumes:
      - ./.env:/config/.env:ro,z
      - vw-data:/data
    environment:
      SUPERVISOR_ENV_FILE: /config/.env

volumes:
  vw-data:
