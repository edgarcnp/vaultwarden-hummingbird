# CI for the supervisor crate: lint -> test -> build, gated in that order.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# Superseded runs on the same branch don't need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: supervisor

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships with a stable rustup toolchain preinstalled.
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            supervisor/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('supervisor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # ubuntu-latest ships with a stable rustup toolchain preinstalled.
      - name: cargo test
        run: cargo test --locked

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            supervisor/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('supervisor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      # ubuntu-latest ships with a stable rustup toolchain preinstalled.
      - name: cargo build
        run: cargo build --locked

  image:
    name: Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The supervisor suite cannot see production-specific code paths:
      # vaultwarden's source build, DB client extraction, library closures,
      # the binary downloads, and the runtime image assembly. Build the
      # real image (single arch is enough for routine PRs; the full
      # multi-arch build stays in publish).
      - name: Build the container image
        run: |
          podman build \
            --format docker \
            --platform linux/amd64 \
            --tag pr-check:ci \
            .

      - name: Verify the healthcheck survived the build
        run: |
          test "$(podman inspect pr-check:ci \
            --format '{{json .HealthCheck.Test}}')" != "null"

      # Smoke: the supervisor must run inside the runtime image (dynamic
      # linking and baked paths intact) and fail fast with no gate to
      # probe — exit 1, not a crash.
      - name: Smoke test the entrypoint
        run: |
          podman run --rm --network none --entrypoint /entrypoint pr-check:ci --healthcheck \
            && exit 1 || test $? -eq 1
