[package]
name = "supervisor"
version = "1.1.10"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
dotenvy = { version = "0.15.7", default-features = false }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
nix = { version = "0.32.0", default-features = false, features = ["signal", "dir", "user", "poll"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rusty-s3 = { version = "0.12.0", default-features = false, features = ["rustcrypto", "xml"] }
sha2 = { version = "0.11.1", default-features = false }
signal-hook = { version = "0.4.6", default-features = false }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
