# Universal runner for the vaultwarden-hummingbird image (podman-compose /
# docker compose). One config file: .env (from .env.example).
#
# Default mode = supervisor-owned: .env is mounted read-only and the
# supervisor distributes it localized (TS_* stays with PID 1; the rest reaches
# the vaultwarden child; secrets stay out of `docker inspect`).
# Simpler alternative: comment the mount + SUPERVISOR_ENV_FILE and uncomment
# `env_file:` — then all keys land in container env instead (TS_* included).
#
# The image is built with WEB_VAULT=false (API-only); flip to true to include
# the browser vault.

services:
  vaultwarden:
    build:
      context: .
      args:
        WEB_VAULT: "false"
    image: vaultwarden-hummingbird:local
    restart: unless-stopped
    # graceful stop needs TERM_GRACE (10s) + a final S3 state push (≤60s);
    # Docker's default 10s would SIGKILL mid-teardown
    stop_grace_period: 90s
    # hardening: userspace networking needs no caps, so drop them all; the
    # rootfs is read-only — everything writable lives in /data (volume) and
    # /tmp (tmpfs: tailscaled socket + staged authkey file)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080" # bind localhost; Tailscale/ts.net handles remote access
    volumes:
      - ./.env:/config/.env:ro # supervisor-owned config (cp .env.example .env first)
      - vw-data:/data
    environment:
      SUPERVISOR_ENV_FILE: /config/.env
      # env_file: .env # alternative: plain container env (no localization)
    # no healthcheck: core-runtime ships no shell/curl; use Render's /alive
    # check on PaaS, or an external probe for self-host

volumes:
  vw-data:
