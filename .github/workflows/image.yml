# The container image: build the real Containerfile and run the
# fail-closed smoke suite (scripts/smoke-image.sh) on changes to the build
# context. Pull requests are where a Containerfile change is validated
# before merge; releases are built and checked by publish at tag time; a
# manual dispatch covers ad-hoc validation of main. Main pushes are
# deliberately not built here: the PR run already tested the same content,
# and rebuilding it on every push just burns CI.
name: Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Containerfile
      - .containerignore
      - .github/workflows/image.yml

# Superseded runs on the same branch don't need to finish.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The supervisor suite cannot see production-specific code paths:
      # vaultwarden's source build, the binary downloads, the runtime
      # assembly. Build the real image (single arch is enough for routine
      # checks; the full multi-arch build stays in publish).
      - name: Build the container image
        run: |
          podman build \
            --format docker \
            --platform linux/amd64 \
            --tag pr-check:ci \
            .

      # The full fail-closed smoke suite: entrypoint execution in the
      # runtime image, strict-dotenv refusals, and the Tailscale
      # fail-closed chain. The same script contributors run locally.
      - name: Smoke test the image
        run: scripts/smoke-image.sh pr-check:ci
