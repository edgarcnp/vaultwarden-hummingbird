# One config file (.env, from .env.example), mounted read-only; the
# supervisor distributes it: TS_*/SUPERVISOR_* stay with PID 1, the rest
# reaches vaultwarden. Alternative: env_file: .env (all keys in container env).
services:
  vaultwarden:
    build:
      context: .
      dockerfile: Containerfile
      args:
        WEB_VAULT: "false"
    image: vaultwarden-hummingbird:local
    restart: unless-stopped
    stop_grace_period: 90s   # TERM_GRACE + final S3 state push
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true          # writable: /data (volume) + /tmp (tmpfs)
    tmpfs:
      - /tmp
    ports:
      # Exposed port serves /alive only (supervisor gatekeeper); the API is
      # tailnet-only via tailscale serve.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.env:/config/.env:ro,z
      - vw-data:/data
    environment:
      SUPERVISOR_ENV_FILE: /config/.env
      # opt-out of vaultwarden's volatile-storage check (any value disables it)
      I_REALLY_WANT_VOLATILE_STORAGE: "false"
      # env_file: .env

volumes:
  vw-data:
